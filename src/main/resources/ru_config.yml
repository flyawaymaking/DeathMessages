  illusioner:
    - "✺ {player} был обманут и убит иллюзионистом"
    - "✧ {player} не смог отличить реальность от иллюзии"

  vex:
    - "✖ {player} был зарезан врединой"
    - "† {player} пал от клинка вредины"

  ravager:
