# Не изменяйте это значение!
config-version: 2

settings:
  # Показывать координаты смерти игроку
  show-death-coordinates: true
  # Показывать кнопку возврата к месту смерти
  show-back-button: true

messages:
  prefix: "<gray>[💀]</gray>"
  reload:
    no-permission: "<red>У вас нет прав для этой команды!"
    success: "<green>Конфиг DeathMessages перезагружен!"
    usage: "<yellow>Использование: /deathmessages reload"
  deathback:
    invalid: "<red>Точка смерти не найдена!"
    success: "<green>Вы были телепортированы к месту смерти!"
  personal-message: "<red>Координаты смерти: <yellow>X: {x} Y: {y} Z: {z}"
  back-button: "<green><bold>[✨ ВЕРНУТЬСЯ]</bold></green>"
  back-hover: "<yellow>Нажмите чтобы вернуться к месту смерти"

# Сообщения о смерти игрока
death-messages:
  prefix: "<gray>"
  # Смерть от другого игрока
  # Доступные плейсхолдеры: {player}, {killer}, {killer_health}
  player:
    - "⚔️ {player} был повержен игроком {killer} [<red>❤</red>{killer_health}]"
    - "🎯 {player} пал от руки {killer} [<red>❤</red>{killer_health}]"
    - "⚡ {player} был убит игроком {killer} [<red>❤</red>{killer_health}]"
    - "💥 {player} проиграл дуэль против {killer} [<red>❤</red>{killer_health}]"

  # ОСНОВНОЙ МИР - Нейтральные и пассивные
  wolf:
    - "⚔ {player} был разорван волком"
    - "♣ {player} стал добычей волка"

  bee:
    - "✹ {player} был ужален пчелой до смерти"
    - "❀ {player} не пережил атаки пчёл"

  iron_golem:
    - "⚒ {player} был размазан големом"
    - "⛓ {player} не пережил удара железного голема"

  snow_golem:
    - "☃ {player} был заморожен снежным големом"
    - "❄ {player} погиб от рук снежного голема"

  polar_bear:
    - "✦ {player} был растерзан полярным медведем"
    - "❄ {player} не пережил атаку белого медведя"

  panda:
    - "❖ {player} был задавлен пандой"
    - "♣ {player} попал под раздачу панды"

  llama:
    - "➹ {player} был обплёван ламой"
    - "❈ {player} не пережил плевок ламы"

  trader_llama:
    - "➹ {player} был атакован ламой торговца"
    - "➜ {player} пал жертвой плевка торговой ламы"

  dolphin:
    - "≈ {player} был забит дельфином"
    - "⚓ {player} не пережил нападение дельфина"

  goat:
    - "▲ {player} был сброшен козлом"
    - "⛰ {player} погиб после удара козла"

  camel:
    - "☼ {player} был задавлен верблюдом"
    - "⌂ {player} не выдержал силы верблюда"

  sulfur_cube:
    - "☢ {player} был поглощён серным кубом"
    - "♨ {player} растворился в серном кубе"

  creaking:
    - "✦ {player} был разорван Скрипуном"
    - "☾ {player} не пережил встречу со Скрипуном"

  # ОСНОВНОЙ МИР - Враждебные
  zombie:
    - "☠ {player} был съеден зомби"
    - "✖ {player} стал жертвой зомби"

  zombie_villager:
    - "☠ {player} был обращён в зомби-жителя"
    - "⌂ {player} стал добычей зомби-жителя"

  drowned:
    - "⚓ {player} был утоплен утопленником"
    - "≈ {player} пал жертвой утопленника"

  husk:
    - "☼ {player} был высушен кадавром (хаском)"
    - "✵ {player} не пережил нападение хаска"

  camel_husk:
    - "☼ {player} был растоптан верблюдом-кадавром"
    - "⌂ {player} не пережил встречу с верблюдом-кадавром"

  parched:
    - "☼ {player} был повержен иссушённым"
    - "☀ {player} стал жертвой иссушённого"

  skeleton:
    - "➶ {player} был застрелен скелетом"
    - "◎ {player} не смог увернуться от скелета"

  stray:
    - "❄ {player} был заморожен ледяным скелетом"
    - "➶ {player} не пережил стрелу зимогора"

  bogged:
    - "➶ {player} был пронзён стрелой болотного скелета"
    - "☠ {player} пал от ядовитой стрелы болотника"

  creeper:
    - "✹ {player} взорвался от крипера"
    - "✸ {player} подорвался на крипере"
    - "✸ {player} попытался погладить крипера"

  spider:
    - "✶ {player} был съеден пауком"
    - "✢ {player} попал в паутину смерти"

  cave_spider:
    - "✶ {player} был отравлен пещерным пауком"
    - "☠ {player} пал от яда пещерного паука"

  silverfish:
    - "✦ {player} был загрызен чешуйницей"
    - "◈ {player} стал добычей чешуйницы"

  enderman:
    - "✧ {player} не смог убежать от эндермена"
    - "✦ {player} попал в лапы эндермена"

  endermite:
    - "✶ {player} был съеден эндермитом"
    - "✝ {player} стал жертвой эндермита"

  witch:
    - "⚗ {player} был отравлен ведьмой"
    - "✧ {player} пал от зелий ведьмы"

  phantom:
    - "☾ {player} был атакован фантомом"
    - "✦ {player} не спал три дня и поплатился"

  slime:
    - "◉ {player} был задавлен слаймом"
    - "◌ {player} утонул в слайме"

  # РЕЙДЫ И ЛЕСНЫЕ ОСОБНЯКИ
  pillager:
    - "➶ {player} был застрелен разбойником"
    - "☠ {player} стал жертвой засадного огня разбойника"

  vindicator:
