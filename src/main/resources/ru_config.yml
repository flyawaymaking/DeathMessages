  starvation:
    - "✖ {player} умер от голода"
    - "☹ {player} забыл поесть"

  magic:
    - "✧ {player} был уничтожен магией"
    - "⚡ {player} пал от колдовства"

  contact:
    - "✵ {player} наткнулся на шипы"
    - "✹ {player} дообнимался с колючкой"

  suffocation:
    - "■ {player} задохнулся в блоке"
    - "✖ {player} разучился дышать"

  explosion:
    - "✹ {player} взорвался"
    - "✸ {player} попал под взрыв"

  lightning:
    - "⚡ {player} был поражен молнией"
    - "☈ {player} привлек внимание Зевса"

  freeze:
    - "❄ {player} замёрз насмерть"
    - "☃ {player} превратился в сосульку"

  fly_into_wall:
    - "✖ {player} слишком быстро встретился со стеной"
