    - "♨ {player} пал от зомбифицированного пиглина"

  hoglin:
    - "⚔ {player} был растоптан хоглином"
    - "✹ {player} пал от атаки хоглина"

  zoglin:
    - "☠ {player} был растерзан зоглином"
    - "✖ {player} пал от ярости зоглина"

  piglin:
    - "⚔ {player} был убит пиглином"
    - "✖ {player} пал от руки пиглина"

  piglin_brute:
    - "⚒ {player} был сокрушён брутальным пиглином"
    - "✖ {player} не выдержал ударов пиглина-брута"

  wither_skeleton:
    - "☠ {player} был повержен визер-скелетом"
    - "⚔ {player} пал от рук визер-скелета"

  # КРАЙ
  guardian:
    - "✦ {player} был поражен лучом стража"
    - "✧ {player} попал под лазер стража"

  elder_guardian:
    - "✦ {player} был побежден древним стражем"
    - "✧ {player} пал от магии древнего стража"

  shulker:
    - "◈ {player} был поражен шалкером"
    - "◎ {player} попал под снаряд шалкера"

  ender_dragon:
    - "✦ {player} был побежден драконом Края"
    - "✧ {player} не смог одолеть дракона Края"

  # БОССЫ И ОСОБЫЕ СУЩНОСТИ
  wither:
