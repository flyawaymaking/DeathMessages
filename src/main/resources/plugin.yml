name: ${name}
version: ${version}
main: ${group}.${name}
api-version: 1.21
author: FlyAwayMaking
website: https://github.com/flyawaymaking
description: Shows the player's death coordinates and edits death messages

commands:
  deathmessages:
    description: Manage the DeathMessages plugin
    usage: /<command> reload

  deathback:
    description: Teleport to the place of death
    usage: /<command> <deathId>

permissions:
  deathmessages.reload:
    description: Reload the plugin config
    default: op

  deathmessages.dback:
    description: Ability to use teleportation to the place of death
    default: true
