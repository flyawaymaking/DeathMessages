# Do not change this value!
config-version: 2

settings:
  # Show death coordinates to the player
  show-death-coordinates: true
  # Show the back-to-deathpoint button
  show-back-button: true

messages:
  prefix: "<gray>[💀]</gray>"
  reload:
    no-permission: "<red>You don't have permission to use this command!"
    success: "<green>DeathMessages config reloaded!"
    usage: "<yellow>Usage: /deathmessages reload"
  deathback:
    invalid: "<red>Death point not found!"
    success: "<green>You have been teleported to your death point!"
  personal-message: "<red>Death coordinates: <yellow>X: {x} Y: {y} Z: {z}"
  back-button: "<green><bold>[✨ BACK]</bold></green>"
  back-hover: "<yellow>Click to return to your death point"

# Player death messages
death-messages:
  prefix: "<gray>"
  # Death by another player
  # Available placeholders: {player}, {killer}, {killer_health}
  player:
    - "⚔️ {player} was slain by {killer} [<red>❤</red>{killer_health}]"
    - "🎯 {player} fell to {killer} [<red>❤</red>{killer_health}]"
    - "⚡ {player} was killed by {killer} [<red>❤</red>{killer_health}]"
    - "💥 {player} lost a duel against {killer} [<red>❤</red>{killer_health}]"

  # OVERWORLD - Neutral & Passive
  wolf:
    - "⚔ {player} was torn apart by a wolf"
    - "♣ {player} became prey to a wolf"

  bee:
    - "✹ {player} was stung to death by a bee"
    - "❀ {player} didn't survive the bee attack"

  iron_golem:
    - "⚒ {player} was smashed by an iron golem"
    - "⛓ {player} didn't survive the iron golem's strike"

  snow_golem:
    - "☃ {player} was frozen by a snow golem"
    - "❄ {player} perished at the hands of a snow golem"

  polar_bear:
    - "✦ {player} was mauled by a polar bear"
    - "❄ {player} didn't survive the polar bear's attack"

  panda:
    - "❖ {player} was crushed by a panda"
    - "♣ {player} got caught in a panda's rampage"

  llama:
    - "➹ {player} was spit on by a llama"
    - "❈ {player} didn't survive the llama's spit"

  trader_llama:
    - "➹ {player} was attacked by a trader's llama"
    - "➜ {player} fell victim to the trader llama's spit"

  dolphin:
    - "≈ {player} was beaten by a dolphin"
    - "⚓ {player} didn't survive the dolphin's attack"

  goat:
    - "▲ {player} was knocked off by a goat"
    - "⛰ {player} perished after a goat's ram"

  camel:
    - "☼ {player} was crushed by a camel"
    - "⌂ {player} couldn't withstand the camel's strength"

  sulfur_cube:
    - "☢ {player} was absorbed by a sulfur cube"
    - "♨ {player} dissolved in a sulfur cube"

  creaking:
    - "✦ {player} was torn apart by a Creaking"
    - "☾ {player} didn't survive the encounter with the Creaking"

  # OVERWORLD - Hostile
  zombie:
    - "☠ {player} was eaten by a zombie"
    - "✖ {player} became a zombie's victim"

  zombie_villager:
    - "☠ {player} was turned into a zombie villager"
    - "⌂ {player} became prey to a zombie villager"

  drowned:
    - "⚓ {player} was drowned by a Drowned"
    - "≈ {player} fell victim to a Drowned"

  husk:
